<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseball Live Tracker</title>
    <link rel="stylesheet" href="./popup.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="popup">
      <section class="header">
        <h1>Baseball Live Tracker</h1>
        <p>KBO 실시간 경기 알림</p>
      </section>

      <select id="favorite-team" class="select">
        <option value="">전체 경기</option>
        <option value="LG">LG 트윈스</option>
        <option value="DOOSAN">두산 베어스</option>
        <option value="KIA">KIA 타이거즈</option>
        <option value="SAMSUNG">삼성 라이온즈</option>
        <option value="LOTTE">롯데 자이언츠</option>
        <option value="HANWHA">한화 이글스</option>
        <option value="SSG">SSG 랜더스</option>
        <option value="KT">KT 위즈</option>
        <option value="NC">NC 다이노스</option>
        <option value="KIWOOM">키움 히어로즈</option>
      </select>

      <section class="game-summary">
        <div class="summary-top">
          <span id="game-status">수집 대기</span>
          <span id="game-date">-</span>
        </div>

        <div class="score-board">
          <div class="score-row">
            <span id="away-team" class="team-name">-</span>
            <strong id="away-score" class="score">-</strong>
          </div>

          <div class="versus">VS</div>

          <div class="score-row">
            <span id="home-team" class="team-name">-</span>
            <strong id="home-score" class="score">-</strong>
          </div>
        </div>

        <div class="summary-bottom">
          <span id="stadium">-</span>
          <span id="game-time">-</span>
        </div>

        <div class="game-detail">
          <div>
            <span class="label">공격 팀</span>
            <strong id="batting-team">-</strong>
          </div>
          <div>
            <span class="label">아웃카운트</span>
            <strong id="out-count">-</strong>
          </div>
          <div>
            <span class="label">주자</span>
            <strong id="base-state">-</strong>
          </div>
        </div>
      </section>

      <section class="rank-info">
        <div>
          <span class="label">팀 순위</span>
          <strong id="selected-rank">-</strong>
        </div>
        <div>
          <span class="label">시즌 성적</span>
          <strong id="selected-record">-</strong>
        </div>
        <div>
          <span class="label">승률 / 게임차</span>
          <strong id="selected-rate">-</strong>
        </div>
      </section>

      <section id="game-list-section" class="game-list-section hidden">
        <h2>전체 경기</h2>
        <ul id="game-list" class="game-list">
          <li class="empty-text">수집 대기</li>
        </ul>
      </section>

      <section class="connection">
        <span id="status-dot" class="status-dot"></span>
        <span id="connection-text">WebSocket 연결 대기</span>
      </section>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
